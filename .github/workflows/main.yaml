name: Publish release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  set-version:
    runs-on: ubuntu-latest
    name: set-version
    permissions:
      contents: read
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: set version
        id: set-version
        run: |
          echo Faking a Semantic Version
          echo "version=1.$(date "+%Y%m%d%H%M%S")" >> ${GITHUB_OUTPUT}

  test:
    needs:
      - set-version
    runs-on: ubuntu-latest
    name: test
    permissions:
      contents: read
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4.3.0
        with:
          cache: false
      - name: Run tests
        run: |
          mise i
          mise check
          mise test

  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write # for adding new releases
      id-token: write # for cosign
    name: release
    needs:
      - set-version
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Set up Cargowall
        uses: code-cargo/cargowall-action@v1.3.9
        with:
          mode: enforce
          sudo-lockdown: true
          allowed-hosts: |
            mise.jdx.dev
            mise-versions.jdx.dev
            dl.google.com
            release-assets.githubusercontent.com
            raw.githubusercontent.com
            tuf-repo-cdn.sigstore.dev
            *.bc.googleusercontent.com
            proxy.golang.org
            *.sigstore.dev
      - name: Checkout latest code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.7
        with:
          cache: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Create tag
        run: |
          git tag $VERSION
        env:
          VERSION: ${{ needs.set-version.outputs.version }}

      - name: build
        run: mise compile

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --config .goreleaser.yaml --clean --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BREW_PUSH_TOKEN: ${{ secrets.BREW_PUSH_TOKEN }}

